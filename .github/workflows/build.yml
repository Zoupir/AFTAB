name: AFTAB tests and installable preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build offline-ready React control panel assets
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Resolve audited Go module checksums
        run: go mod tidy
      - name: Format Go sources for deterministic test/build
        run: go fmt ./...
      - name: Unit and integration tests
        run: go test -race -count=1 -timeout=90s ./...
      - name: Validate Stage 1 integration tool
        run: python3 -m unittest discover -s tools -p test_apply_to_aftab.py -v
      - name: Static analysis
        run: go vet ./...
      - name: Real Xray-core REALITY runtime integration
        run: bash labs/ci/xray-integration.sh
      - name: Linux executable
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/aftab-linux-amd64 ./cmd/aftab
      - name: Isolated AFTAB panel preview
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/aftab-panel-linux-amd64 ./cmd/panel
      - name: Dedicated local AFTAB Xray agent
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/aftab-agent-linux-amd64 ./cmd/agent
      - name: Windows graphical executable
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/aftab-windows-amd64.exe ./cmd/aftab
      - name: Create Debian service package
        run: |
          set -eu
          PKG="$RUNNER_TEMP/aftab-debroot"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/lib/systemd/system"
          install -m 0755 dist/aftab-linux-amd64 "$PKG/usr/bin/aftab-server"
          install -m 0644 packaging/aftab-server.service "$PKG/lib/systemd/system/aftab-server.service"
          install -m 0644 packaging/debian-control "$PKG/DEBIAN/control"
          cat > "$PKG/DEBIAN/postinst" <<'POSTINST'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            systemctl enable aftab-server.service >/dev/null 2>&1 || true
            systemctl restart aftab-server.service || true
          fi
          exit 0
          POSTINST
          chmod 0755 "$PKG/DEBIAN/postinst"
          dpkg-deb --build "$PKG" dist/aftab-server-amd64.deb
          dpkg-deb --info dist/aftab-server-amd64.deb
      - name: Portable Windows package
        run: zip -j dist/aftab-windows-portable.zip dist/aftab-windows-amd64.exe packaging/README-WINDOWS.txt
      - name: Portable Linux package
        run: tar -czf dist/aftab-linux-portable.tar.gz -C "$GITHUB_WORKSPACE/dist" aftab-linux-amd64 -C "$GITHUB_WORKSPACE/packaging" aftab-server.service
      - name: Checksum manifest
        run: cd dist && sha256sum aftab-linux-amd64 aftab-panel-linux-amd64 aftab-agent-linux-amd64 aftab-windows-amd64.exe aftab-server-amd64.deb aftab-windows-portable.zip aftab-linux-portable.tar.gz > SHA256SUMS.txt
      - name: Export reproducible Go and Node dependency lockfiles
        run: cp go.sum web/package-lock.json dist/
      - name: Upload Linux Windows and Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aftab-installable-preview
          path: dist/
          retention-days: 30

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Resolve Go module checksums for native Windows tests
        run: go mod tidy
      - name: Test native Windows DPAPI, GUI and SOCKS implementation
        run: go test -count=1 -timeout=90s ./cmd/aftab
      - name: Native Windows build
        run: go build -o aftab-windows-native-check.exe ./cmd/aftab
