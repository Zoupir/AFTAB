name: Go checks
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/aftab
      - run: GOOS=windows GOARCH=amd64 go build -o aftab-windows-amd64.exe ./cmd/aftab
